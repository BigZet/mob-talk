plugins { id 'fabric-loom' version "${loom_version}" }
version = project.mod_version
group = 'io.github.alicespeaker'
base { archivesName = 'alicespeaker' }
loom {
    splitEnvironmentSourceSets()
    mods {
        alicespeaker {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Pure-Java Opus decoder (BSD-3-Clause): Alice's voice arrives as Ogg/Opus.
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    include 'io.github.jaredmdobson:concentus:1.0.2'
    // MP3 decoder (LGPL-2.1) for Yandex Music tracks.
    implementation 'javazoom:jlayer:1.0.1'
    include 'javazoom:jlayer:1.0.1'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
jar { from('../LICENSE') { rename { 'LICENSE_alicespeaker' } } }
