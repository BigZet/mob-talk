plugins { id 'fabric-loom' version "${loom_version}" }
version = project.mod_version
group = 'io.github.mobtalk'
base { archivesName = 'mobtalk' }
loom {
    splitEnvironmentSourceSets()
    // Трек S1: `gradlew runServer -PmobtalkSelftest=true` — выделенный сервер без клиента, который проверяет мост и пакеты и
    // останавливается (ServerSelfTest, раздел 16.3 плана); scripts/run-server-selftest.ps1 готовит run/server и читает лог.
    runs {
        server {
            runDir 'run/server'
            programArg 'nogui'
            vmArg '-Dmobtalk.selftest.server=' + (project.findProperty('mobtalkSelftest') ?: 'false')
        }
    }
    mods {
        mobtalk {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
// Трек M: перенесённый из MCA Reborn рендер людей-жителей и его текстуры (GPL-3.0), см. third_party/mca-reborn/NOTICE.md.
sourceSets {
    main { java { srcDir 'third_party/mca-reborn/src/main/java' } }
    client { java { srcDir 'third_party/mca-reborn/src/client/java' }; resources { srcDir 'third_party/mca-reborn/src/client/resources' } }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation 'javazoom:jlayer:1.0.1'
    include 'javazoom:jlayer:1.0.1'
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform(); testLogging { events 'failed'; exceptionFormat 'full' } }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from('tools/whisper_server.py') { into 'assets/mobtalk/helper' }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
jar {
    from('LICENSE') { rename { 'LICENSE_mobtalk' } }
    from('THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
}
